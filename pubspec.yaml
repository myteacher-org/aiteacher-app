name: ai_teacher
description: "My AI Teacher app for students"
publish_to: 'none'
version: 2.2.0+72

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_launcher_icons: ^0.14.4
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  talker_dio_logger: ^4.7.6
  shared_preferences: ^2.3.3
  pinput: ^5.0.1
  record: ^6.1.1
  path_provider: ^2.1.5
  socket_io_client: ^3.0.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.0
  flutter_webrtc: ^0.12.0
  audioplayers: ^6.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  lottie: ^3.1.2
  flutter_markdown_plus: ^1.0.3
  flutter_inappwebview: ^6.1.5
  chewie: ^1.13.1
  video_player: ^2.11.1
  image_picker: ^1.1.2
  upgrader: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/images/
    - assets/lottie/
    - assets/dictionary/

flutter_launcher_icons:
  image_path: assets/images/brand.png
  android: true
  ios: true
  remove_alpha_ios: true